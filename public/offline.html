<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tutor Tracker — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #FAF8F4;
      color: #1C1917;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #E8F5F2;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2rem;
      color: #1A6B5C;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #78716C;
      line-height: 1.6;
      max-width: 300px;
    }
    .retry-btn {
      margin-top: 2rem;
      background: #1A6B5C;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1A6B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 6s0-1 1-1 2 1 3 1 2-1 3-1 2 1 3 1 2-1 3-1 2 1 3 1" />
      <path d="M1 10s0-1 1-1 2 1 3 1 2-1 3-1 2 1 3 1 2-1 3-1 2 1 3 1" />
      <line x1="12" y1="22" x2="12" y2="1" />
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Your data will be here when you're back online.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try again</button>
</body>
</html>
